# CI Pipeline for Employee Portal
# Stack: .NET 10 | Razor Pages | PostgreSQL | xUnit
#
# Build Frequency Target: >=1 build/day toward iteration end (RUP Integrator heuristic)
#
# Dependency Hierarchy (bottom-up integration order per SAD):
#   Layer 1: Infrastructure — PostgreSQL | LDAP (AD)
#   Layer 2: Cross-Cutting — Auth (OIDC/Keycloak)
#   Layer 3: Features — Clocking | News | Directory | Worker Category
#   Layer 4: UI — Razor Pages
#
# Integration record (Integrator — Elaboration Iteration 3, incremental merges):
#   2026-09-02  PR #3 MERGED — R001 LDAP Gateway graceful degradation
#               (COMP-007/CLS-009; four-clause behavioural bar, UC-004/005/006/007)
#               merge SHA d413e23dcbb0ffefb842e74aadc9a54ce8fbaf4a
#               Code Reviewer: APPROVED (review 5088169328); pre-merge CI green (run 33616349487)
#               post-merge verification: CI GREEN (run 33617283642)
#   2026-09-02  PR #5 MERGED — R004 offline queue + idempotent sync
#               (COMP-009/CLS-008, CLS-001; UNIQUE idempotency_key REL-002,
#               sync <= 60 s REL-003, AC-005 drop simulation)
#               merge SHA 3fe41190f0e7d25ca0fd3a3e605e3039364fcabf
#               Code Reviewer: APPROVED (review 5088169685); pre-merge CI green (run 33616359385)
#   Pending:    PR #4 (R003 OIDC stub issuer)
#
# PlantUML dependency sketch:
# @startuml
# package "Layer 1: Infrastructure" {
#   component "PostgreSQL" as PG
#   component "LDAP (AD)" as LDAP
# }
# package "Layer 2: Cross-Cutting" {
#   component "OIDC Auth (Keycloak)" as AUTH
# }
# package "Layer 3: Features" {
#   component "Clocking" as CLK
#   component "News" as NEWS
#   component "Directory" as DIR
#   component "Worker Category" as WC
# }
# package "Layer 4: UI" {
#   component "Razor Pages" as UI
# }
# PG <-- CLK
# PG <-- NEWS
# PG <-- WC
# LDAP <-- DIR
# AUTH <-- CLK
# AUTH <-- NEWS
# AUTH <-- DIR
# AUTH <-- WC
# UI --> CLK
# UI --> NEWS
# UI --> DIR
# UI --> WC
# @enduml

name: CI

on:
  push:
    branches: [main, 'iteration/**', 'chore/**', 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main, 'iteration/**', 'chore/**', 'feature/**', 'hotfix/**']

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Regenerate solution from src/ and tests/ tree
        run: |
          rm -f *.sln
          dotnet new sln --name EmployeePortal
          for f in $(find src tests -name '*.csproj'); do dotnet sln add "$f"; done
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Regenerate solution from src/ and tests/ tree
        run: |
          rm -f *.sln
          dotnet new sln --name EmployeePortal
          for f in $(find src tests -name '*.csproj'); do dotnet sln add "$f"; done
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal --logger trx
