name: Deploy Employee Portal

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - production

# Deployment workflow skeleton — Inception baseline
# Steps to be populated in Construction phase when:
# - Build pipeline produces publishable artifacts
# - Windows Server deployment target is provisioned (R010)
# - Keycloak client registration is complete (R010)
# - LDAP service account is configured (R010)
#
# Planned stages:
# 1. build: dotnet publish -c Release -o ./publish
# 2. test: run unit + integration tests
# 3. package: create deployment zip
# 4. deploy-dev: deploy to development Windows Server (Gate 1)
# 5. deploy-production: deploy to production Windows Server (Gate 2, manual approval)
#
# Two-gate acceptance model:
# - Gate 1 (dev-site): automatic on push to main
# - Gate 2 (production): manual trigger with environment selection
#
# Rollback: re-deploy previous tag, redirect to maintenance page

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal
      - name: Publish
        run: dotnet publish --configuration Release --no-build --output ./publish
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-portal-publish
          path: ./publish

  # deploy-dev and deploy-production jobs to be added in Construction
  # when Windows Server target is provisioned by STK-004 (R010)
